<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Profile Links</title>
    <!-- FontAwesome & Google Font -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0d0a1a;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(147, 51, 234, 0.25) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(245, 158, 11, 0.2) 0%, transparent 40%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 15px;
            color: #ffffff;
        }

        /* Khung thẻ chứa danh sách nút */
        .card-profile {
            width: 100%;
            max-width: 414px; /* Vừa vặn hoàn hảo cho iPhone XR */
            background: rgba(23, 15, 38, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(245, 158, 11, 0.25);
            border-radius: 28px;
            padding: 24px 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6),
                        0 0 15px rgba(147, 51, 234, 0.15);
        }

        /* Tựa đề các Mục */
        .section-title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: #f59e0b;
            margin: 10px 0 14px 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title:not(:first-child) {
            margin-top: 24px;
        }

        .section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, rgba(245, 158, 11, 0.3), transparent);
        }

        /* Grid hiển thị Nút Link */
        .grid-links {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        /* Thiết kế Nút Bấm (Button) */
        .link-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 14px 16px;
            border-radius: 16px;
            color: #f1f5f9;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.25s ease;
        }

        .link-item i {
            font-size: 18px;
            width: 20px;
            text-align: center;
        }

        /* Hiệu ứng chạm / di chuột */
        .link-item:hover, .link-item:active {
            background: rgba(147, 51, 234, 0.2);
            border-color: #a855f7;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(168, 85, 247, 0.25);
        }

        /* Màu sắc Icon */
        .fa-facebook { color: #1877f2; }
        .fa-tiktok { color: #00f2fe; }
        .fa-camera { color: #facc15; }
        .fa-comment-dots { color: #38bdf8; }
        .fa-telegram { color: #229ed9; }
        .fa-store { color: #f59e0b; }
        .fa-briefcase { color: #34d399; }
        .fa-qrcode { color: #f43f5e; }

        /* Nút full độ rộng */
        .link-item.full-width {
            grid-column: span 2;
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.15), rgba(168, 85, 247, 0.15));
            border-color: rgba(245, 158, 11, 0.4);
        }

        .link-item.full-width:hover, .link-item.full-width:active {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.3), rgba(168, 85, 247, 0.3));
            border-color: #f59e0b;
            box-shadow: 0 8px 20px rgba(245, 158, 11, 0.25);
        }
    </style>
</head>
<body>

    <div class="card-profile">
        
        <!-- Mạng xã hội -->
        <div class="section-title">Thông Tin Mạng Xã Hội</div>
        <div class="grid-links">
            <a href="https://www.facebook.com/share/1AiTnJQw95/?mibextid=wwXIfr" target="_blank" class="link-item">
                <i class="fab fa-facebook"></i> Facebook
            </a>
           
            <a href="https://www.tiktok.com/@damtrongnghia1759?_r=1&_t=ZS-97ZethfBYrB" target="_blank" class="link-item">
                <i class="fab fa-tiktok"></i> Tiktok
            </a>

            <a href="https://locket.cam/bebo1759" target="_blank" class="link-item">
                <i class="fas fa-camera"></i> Locket
            </a>
            
            <a href="https://zalo.me/0793579118" target="_blank" class="link-item" id="copyPhone">
                <i class="fas fa-comment-dots"></i> Zalo
            </a>

            <a href="https://t.me/nghia1759" target="_blank" class="link-item full-width">
                <i class="fab fa-telegram"></i> Telegram
            </a>
        </div>

        <!-- Tài nguyên & Khác -->
        <div class="section-title">Tài Nguyên & Khác</div>
        <div class="grid-links">
            <a href="sell.html" class="link-item">
                <i class="fas fa-store"></i> Shop MMO
            </a>

            <a href="MMO.html" class="link-item">
                <i class="fas fa-briefcase"></i> Dịch Vụ Của Tôi
            </a>

            <a href="thanhtoan.html" class="link-item full-width">
                <i class="fas fa-qrcode"></i> QR Thanh Toán
            </a>
        </div>

    </div>

    <script src="in4/script.js"></script>
</body>
</html>
