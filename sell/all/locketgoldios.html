<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tải File Tài Nguyên</title>
    <style>
        /* CSS để tạo giao diện đẹp */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .download-card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .file-icon {
            font-size: 50px;
            color: #f5576c;
            margin-bottom: 20px;
        }

        /* Tên file nổi bật ở trên đầu */
        .file-name {
            font-size: 24px;
            color: #333;
            margin: 0 0 10px 0;
            word-wrap: break-word;
        }

        .file-info {
            color: #777;
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* Nút tải gradient */
        .btn-download {
            display: inline-block;
            background: linear-gradient(45deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            font-size: 18px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(245, 87, 108, 0.4);
        }

        .btn-download:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(245, 87, 108, 0.6);
        }

        .back-link {
            display: block;
            margin-top: 20px;
            color: #999;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="download-card">
        <div class="file-icon">📁</div>
        
        <h1 class="file-name">Config Shadowrocket Locket Gold</h1>
        
        <p class="file-info">Định dạng: Config | Dung lượng: 3kb</p>

        <a href="sell/all/file/locketgoldshadowrocket.conf" download="Config Shadowrocket Locket Gold" class="btn-download">
            BẮT ĐẦU TẢI VỀ
        </a>

        <a href="index.html" class="back-link">← Quay lại trang chủ</a>
    </div>

</body>
</html>
