<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Thanh Toán - Đàm Trọng Nghĩa</title>
    <!-- FontAwesome & Google Font -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #090d16;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(16, 185, 129, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(59, 130, 246, 0.12) 0%, transparent 40%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 15px;
            color: #ffffff;
        }

        /* Card container tổng */
        .pay-card {
            width: 100%;
            max-width: 414px; /* Vừa chuẩn iPhone XR */
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            padding: 24px 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5),
                        0 0 20px rgba(16, 185, 129, 0.08);
            text-align: center;
        }

        .main-title {
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: #10b981;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* Khung chứa từng cổng thanh toán */
        .bank-block {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 18px 15px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .bank-block:hover {
            border-color: rgba(16, 185, 129, 0.3);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        /* QR Code */
        .qr-container {
            background: #ffffff;
            padding: 10px;
            border-radius: 16px;
            display: inline-block;
            margin-bottom: 16px;
            width: 180px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .qr-image {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 6px;
        }

        /* Thông tin chuyển khoản */
        .pay-details {
            text-align: left;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 14px;
            padding: 12px 14px;
            margin-bottom: 14px;
        }

        .pay-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .pay-item:last-child {
            border-bottom: none;
        }

        .label {
            color: #94a3b8;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .value {
            color: #f8fafc;
            font-weight: 600;
            font-size: 0.88rem;
            text-align: right;
        }

        .highlighted {
            color: #10b981;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
        }

        /* Nút Sao Chép */
        .btn-copy {
            width: 100%;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.15), rgba(59, 130, 246, 0.15));
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #34d399;
            padding: 12px;
            border-radius: 14px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.25s ease;
        }

        .btn-copy:active {
            transform: scale(0.98);
            background: rgba(16, 185, 129, 0.3);
            color: #ffffff;
        }

        /* Đường phân cách */
        .divider {
            border: none;
            height: 1px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.15) 0%, transparent 100%);
            margin: 20px 0;
        }

        /* Nút quay lại */
        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #64748b;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 10px;
            padding: 8px 16px;
            border-radius: 20px;
            transition: all 0.2s ease;
        }

        .btn-back:hover, .btn-back:active {
            color: #f8fafc;
            background: rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>

    <div class="pay-card">
        
        <div class="main-title">
            <i class="fa-solid fa-qrcode"></i> Kênh Thanh Toán
        </div>

        <!-- CỔNG 1: TP BANK -->
        <div class="bank-block">
            <div class="qr-container">
                <img src="thanhtoan/img/tpbank.png" alt="QR TPBank" class="qr-image">
            </div>

            <div class="pay-details">
                <div class="pay-item">
                    <span class="label">Ngân hàng</span>
                    <span class="value">TP BANK</span>
                </div>
                <div class="pay-item">
                    <span class="label">Chủ tài khoản</span>
                    <span class="value">ĐÀM TRỌNG NGHĨA</span>
                </div>
                <div class="pay-item">
                    <span class="label">Số tài khoản</span>
                    <span class="value highlighted" id="stk-tpbank">1705 2009 219</span>
                </div>
            </div>

            <button class="btn-copy" onclick="copySTK('stk-tpbank', this)">
                <i class="fa-regular fa-copy"></i>
                <span>Sao chép STK TPBank</span>
            </button>
        </div>

        <!-- CỔNG 2: MB BANK -->
        <div class="bank-block">
            <div class="qr-container">
                <img src="thanhtoan/img/mbbank.png" alt="QR MBBank" class="qr-image">
            </div>

            <div class="pay-details">
                <div class="pay-item">
                    <span class="label">Ngân hàng</span>
                    <span class="value">MB BANK</span>
                </div>
                <div class="pay-item">
                    <span class="label">Chủ tài khoản</span>
                    <span class="value">ĐÀM TRỌNG NGHĨA</span>
                </div>
                <div class="pay-item">
                    <span class="label">Số tài khoản</span>
                    <span class="value highlighted" id="stk-mbbank">0948877241</span>
                </div>
            </div>

            <button class="btn-copy" onclick="copySTK('stk-mbbank', this)">
                <i class="fa-regular fa-copy"></i>
                <span>Sao chép STK MBBank</span>
            </button>
        </div>

        <!-- NÚT QUAY LẠI -->
        <a href="index.html" class="btn-back">
            <i class="fas fa-arrow-left"></i> Quay lại trang chủ
        </a>

    </div>

    <!-- SCRIPT SAO CHÉP CHÍNH XÁC TỪNG TÀI KHOẢN -->
    <script>
        function copySTK(elementId, btnElement) {
            const stkText = document.getElementById(elementId).innerText.replace(/\s+/g, ''); // Xóa khoảng trắng khi copy
            const spanText = btnElement.querySelector('span');
            const originalText = spanText.innerText;

            navigator.clipboard.writeText(stkText).then(() => {
                spanText.innerText = "Đã sao chép thành công!";
                btnElement.style.borderColor = "#10b981";
                btnElement.style.color = "#ffffff";
                btnElement.style.background = "rgba(16, 185, 129, 0.4)";

                setTimeout(() => {
                    spanText.innerText = originalText;
                    btnElement.style.borderColor = "";
                    btnElement.style.color = "";
                    btnElement.style.background = "";
                }, 2000);
            }).catch(err => {
                console.error("Lỗi sao chép:", err);
            });
        }
    </script>
</body>
</html>
